name: README Tic-Tac-Toe

on:
  issues:
    types: [opened]

# Only exact game commands may run with the write token.
permissions:
  contents: write
  issues: write

concurrency:
  group: readme-tictactoe
  cancel-in-progress: false

jobs:
  play:
    if: contains(fromJSON('["ttt-reset","ttt-move-0","ttt-move-1","ttt-move-2","ttt-move-3","ttt-move-4","ttt-move-5","ttt-move-6","ttt-move-7","ttt-move-8"]'), github.event.issue.title)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse command from issue title
        id: parse
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Raw title: $TITLE"
          case "$TITLE" in
            ttt-reset)        CMD="reset" ;;
            ttt-move-[0-8])   CMD="move-${TITLE##*-}" ;;
            *)                echo "Invalid game command." >&2; exit 1 ;;
          esac
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "Resolved command: $CMD"

      - name: Run game engine
        id: game
        env:
          GAME_REPO: ${{ github.repository }}
          GAME_COMMAND: ${{ steps.parse.outputs.cmd }}
        run: node game/tictactoe.js "$GAME_COMMAND"

      - name: Commit updated board
        env:
          ACTOR: ${{ github.event.issue.user.login }}
          GAME_COMMAND: ${{ steps.parse.outputs.cmd }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🎮 Tic-Tac-Toe: $GAME_COMMAND (by @$ACTOR)"
            git push
          fi

      - name: Comment result and close issue
        uses: actions/github-script@v7
        env:
          GAME_MESSAGE: ${{ steps.game.outputs.message }}
        with:
          script: |
            const message = process.env.GAME_MESSAGE || "Move processed.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${message}\n\nThanks for playing! Head back to the [profile README](https://github.com/${context.repo.owner}) and refresh to see the updated board. 🎮`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });
